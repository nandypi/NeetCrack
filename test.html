<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson Viewer</title>


    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/github-markdown-css/github-markdown.min.css">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/prismjs@1/themes/prism-tomorrow.min.css">


          
    <style>
        body {
            background: #202225;
            margin: 0;
            padding: 40px;
        }

        .markdown-body {
            max-width: 900px;
            margin: auto;
            background: #2f3136;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 0 8px rgba(99, 97, 97, 0.08);
        }

        /** code tabs css **/
        .code-tabs{
            margin:24px 0;
            border:1px solid #3d3d3d;
            border-radius:10px;
            overflow:hidden;
            background:#1e1e1e;
        }
        .tab-bar{
            display:flex;
            gap:2px;
            background:#2b2b2b;
            border-bottom:1px solid #3d3d3d;
            overflow-x:auto;
        }
        .tab-bar button{
            appearance:none;
            border:none;
            background:transparent;
            color:#9ca3af;
            padding:12px 18px;
            cursor:pointer;
            font-size:14px;
            white-space:nowrap;
            transition:.2s;
        }
        .tab-bar button:hover{
            color:#fff;
            background:#383838;
        }
        .tab-bar button.active{
            color:#fff;
            background:#1e1e1e;
            border-bottom:3px solid #3b82f6;
        }
        .tab-content{
            display:none;
        }
        .tab-content.active{
            display:block;
        }
        /* Remove extra margin from Prism */
        .tab-content pre{
            margin:0 !important;
            border-radius:0 !important;
        }

        /** youtube cards **/
        .youtube-card{
            position:relative;
            margin:30px 0;
        }
        .youtube-card img{
            width:100%;
            border-radius:10px;
            display:block;
        }
        .play-button{
            position:absolute;
            left:50%;
            top:50%;
            transform:translate(-50%,-50%);
            font-size:70px;
            color:white;
            text-shadow:0 0 20px black;
            pointer-events:none;
        }

    </style>
</head>
<body>

<article id="content" class="markdown-body"></article>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script>



<script type="module">
    import { marked } from "https://cdn.jsdelivr.net/npm/marked/lib/marked.esm.js";

    // Replace this with your markdown string
const md = {
    "data": "# Markdown content goes here\n\nThis is a sample markdown content to demonstrate the rendering of markdown in HTML using the marked library."
}


////////////////////////
function escapeHtml(str) {
    return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

function renderTabs(block) {

    const langs = [];
    const codes = [];

    const codeRegex = /```([\w#+-]+)\r?\n([\s\S]*?)```/g;

    let m;

    while ((m = codeRegex.exec(block)) !== null) {
        langs.push(m[1]);
        codes.push(m[2].trimEnd());
    }

    return `
<div class="code-tabs">

    <div class="tab-bar">

        ${langs.map((l,i)=>`
            <button class="${i===0?"active":""}"
                    data-index="${i}">
                ${l}
            </button>
        `).join("")}

    </div>

    ${codes.map((c,i)=>`

<div class="tab-content ${i===0?"active":""}">

<pre><code class="language-${langs[i]}">${escapeHtml(c)}</code></pre>

</div>

`).join("")}

</div>
`;
}

function renderYoutube(html){

    const src = html.match(/src="([^"]+)"/);

    if(!src) return html;

    const embed = src[1];

    const id = embed.match(/embed\/([^?"]+)/)?.[1];

    if(!id) return html;

    return `
<a class="youtube-card"
   target="_blank"
   href="https://www.youtube.com/watch?v=${id}">

<img
src="https://img.youtube.com/vi/${id}/hqdefault.jpg">

<div class="play">
▶ Watch Video
</div>

</a>
`;
}

function preprocess(md){

    const specials=[];

    md=md.replace(
        /<iframe[\s\S]*?<\/iframe>/g,
        match=>{

            const id=specials.length;

            specials.push(renderYoutube(match));

            return `@@SPECIAL_${id}@@`;

        });

    md=md.replace(
        /::tabs-start\r?\n([\s\S]*?)::tabs-end/g,
        (_,block)=>{

            const id=specials.length;

            specials.push(renderTabs(block));

            return `@@SPECIAL_${id}@@`;

        });

    let html=marked.parse(md);

    html=html.replace(
        /@@SPECIAL_(\d+)@@/g,
        (_,id)=>specials[id]);

    return html;
}
function wireTabs() {
    document.querySelectorAll(".code-tabs").forEach(tab=>{

        const buttons=tab.querySelectorAll(".tab-bar button");
        const pages=tab.querySelectorAll(".tab-content");

        buttons.forEach((btn,i)=>{

            btn.onclick=()=>{

                buttons.forEach(b=>b.classList.remove("active"));
                pages.forEach(p=>p.classList.remove("active"));

                btn.classList.add("active");
                pages[i].classList.add("active");

                Prism.highlightAllUnder(pages[i]);

            };

        });

    });
}
////////////////////////



////////////////////////

content.innerHTML = preprocess(md.data);

renderMathInElement(content,{
    delimiters:[
        {left:"$$",right:"$$",display:true},
        {left:"$",right:"$",display:false}
    ]
});

Prism.highlightAll();

wireTabs();



</script>

<script src="https://cdn.jsdelivr.net/npm/prismjs@1/prism.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-java.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-cpp.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-csharp.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-go.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-kotlin.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-swift.min.js"></script>
</body>
</html>
